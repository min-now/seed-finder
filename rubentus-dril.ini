[parameters]
; mac_address = 00:1B:7A:A7:47:33
mac_address = 0x1B7AA74733

; language options: english, japanese, french, italian, german, spanish, korean
language = english

; version options: black, white, black_2, white_2
version = white_2

; search types: iv, iv_pokerus, trainer_skip, plasma_skip, acupressure
search_type = acupressure

[search.ivs]
hp_iv_range 	= 31, 31
atk_iv_range 	= 31, 31
def_iv_range 	= 31, 31
spatk_iv_range 	= 0, 31
spdef_iv_range 	= 31, 31
speed_iv_range 	= 31, 31

[search.pkrs]
pkrs_frame_range = 2900, 3200

[search.trainer_skip]
; start options:
;  - default: inside the humilau gym
;  - x, y: coordinates humilau city
start = default

[search.plasma_skip]

[search.acupressure]
; todo: write up
stat_order = speed, speed, evasion, evasion, speed, defense, sp.def, defense, sp.atk, attack, attack, attack, defense, sp.atk, accuracy, sp.def, accuracy, evasion, sp.atk, accuracy, sp.def
; stat_order = defense, sp.atk, defense, attack, accuracy, sp.def, attack, defense, speed, attack, evasion, sp.atk, evasion, sp.atk, accuracy, speed, speed, sp.def, evasion, accuracy, sp.def

[parameters.date_time]
; Filters out specific dates depending on the game version
;
; black/white applies the following date filters:
; - Exclusively search winter months
; - Ignore dates with Hail
;
; black_2/white_2 applies the following date filters:
; - Ignore summer months
; - Ignore dates with Rain or Hail in:
; 	- Flocessy Town / Route 20
; 	- Virbank City
; 	- Driftveil City / Route 6
;
; For more information, see: 
; 	- bw1: https://web.archive.org/web/20230319002112/http://wiki.pokemonspeedruns.com/index.php/Pok%C3%A9mon_Black/White/Winter_weather
; 	- bw2: https://docs.google.com/spreadsheets/d/16WCOVv80hkMrcXyQPorrgBBRBjsLQcq8q7N4VxnDewo
use_speedrun_filters = 0

year_range = 2086, 2086
month_range = 4, 4
day_range = 26, 26

hour_range = 23, 23
minute_range = 36, 36
second_range = 6, 6

[parameters.misc]
timer0_range = 0x10F5, 0x10F5
max_keypresses = 3
soft_reset = 0

; Do not modify the values below unless you know what you're doing
vcount_range_bw1 = 0x60, 0x60
vcount_range_bw2 = 0x82, 0x82
vframe_range = 0x8, 0x8
gxstat_range = 0x6, 0x6

